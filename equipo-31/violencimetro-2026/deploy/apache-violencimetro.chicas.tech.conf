<VirtualHost *:80>
    ServerName violencimetro.chicas.tech
    DocumentRoot /var/www/violencimetro.chicas.tech/public_html
    DirectoryIndex index.html

    <Directory /var/www/violencimetro.chicas.tech/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/violencimetro_error.log
    CustomLog ${APACHE_LOG_DIR}/violencimetro_access.log combined
</VirtualHost>
